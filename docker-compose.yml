# =============================================
# App + MySQL en Docker
# Uso:  docker compose up --build
# Swagger: http://localhost:8080/swagger-ui/index.html
# Las credenciales SMTP/JWT se leen del archivo .env (ver .env.example)
# =============================================
services:
  mysql:
    image: mysql:8.4
    container_name: users-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-1234567}
      MYSQL_DATABASE: crud_usuarios
    ports:
      - "3307:3306"   # 3307 en el host para no chocar con un MySQL local
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: users-app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_ENGINE: mysql
      DB_HOST: mysql          # nombre del servicio, no "localhost"
      DB_PORT: 3306
      DB_NAME: crud_usuarios
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-1234567}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      JWT_SECRET: ${JWT_SECRET:-ZGV2ZWxvcG1lbnQtb25seS1qd3Qtc2VjcmV0LW11c3QtYmUtcmVwbGFjZWQ=}

volumes:
  mysql-data:
